spring.application.name=flight-tracker

# Local secrets (database password, OpenSky credentials) live in backend/.env, which is not committed.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/flight_tracker}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# OpenSky Network API. Without credentials you get ~400 requests/day, so poll every 4 minutes.
# With a free account (4,000/day) a 30 second interval fits comfortably.
opensky.client-id=${OPENSKY_CLIENT_ID:}
opensky.client-secret=${OPENSKY_CLIENT_SECRET:}
opensky.poll-interval=${OPENSKY_POLL_INTERVAL:PT4M}

# Area to track: greater Chicago (about 3.6 square degrees, which costs 1 API credit per request).
opensky.area.min-lat=41.0
opensky.area.max-lat=42.8
opensky.area.min-lon=-88.8
opensky.area.max-lon=-86.8

management.endpoints.web.exposure.include=health
